defaults:
  provider: openrouter
  prompt_version: v3
  temperature: 0
  max_tokens: 2000
  timeout_s: 120
  max_api_retries: 3
  max_retry_after_s: 30
  max_parse_retries: 2

guardrails:
  canary: nbx-canary-65715a96092857fd
  max_query_chars: 4000

providers:
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_model: nvidia/nemotron-3.5-super-vl:free
    eval_sleep_s: 3.2
    models:
      "nvidia/nemotron-3.5-super-vl:free":
        price_in_per_mtok: 0
        price_out_per_mtok: 0
        price_source: https://openrouter.ai/api/v1/models
        price_date: "2026-11-08"
        list_price:
          model: nvidia/nemotron-3.5-super-vl
          in_per_mtok: 0.15
          out_per_mtok: 0.5
          source: https://openrouter.ai/api/v1/models
          date: "2026-11-08"
      "dots-studio/dots-3-note-preview:free":
        price_in_per_mtok: 0
        price_out_per_mtok: 0
        price_source: https://openrouter.ai/api/v1/models
        price_date: "2026-11-08"
        list_price:
          model: nvidia/nemotron-3.5-super-vl
          in_per_mtok: 0.15
          out_per_mtok: 0.5
          source: https://openrouter.ai/api/v1/models
          date: "2026-11-08"
          note: "sin variante paga de dots en OpenRouter; referencia de tamaño parecido (12B activos frente a 16B)"
  gemini:
    api_key_env: GEMINI_API_KEY
    default_model: gemini-3.5-flash-lite
    eval_sleep_s: 4.5
    models:
      gemini-3.5-flash-lite:
        price_in_per_mtok: 0
        price_out_per_mtok: 0
        price_source: https://aistudio.google.com/docs/pricing
        price_date: "2026-11-08"
        list_price:
          model: gemini-3.5-flash-lite
          in_per_mtok: 0.30
          out_per_mtok: 2.50
          source: https://aistudio.google.com/docs/pricing
          date: "2026-11-08"
