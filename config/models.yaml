defaults:
  provider: openrouter
  prompt_version: v1
  temperature: 0
  max_tokens: 2000
  timeout_s: 60
  max_api_retries: 3
  max_parse_retries: 2

providers:
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default_model: nvidia/nemotron-3.5-super-vl:free
